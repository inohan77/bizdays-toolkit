name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるため、バージョンを固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # npm の動作要件を満たすバージョン（RELEASING.md の「開発環境のバージョン」）
        node: ["22.23.4", "24.22.2", "26.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # サイズの上限の検査（scripts/check-size.ts）が前のバージョンのタグを読むため、履歴とタグを取得する
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check
      - name: Show package contents
        run: npm pack --dry-run --ignore-scripts

  compat:
    # 公開する dist を、engines の下限と、check で使わない LTS・LTS 入りを控えた系列で確かめる（バージョンは matrix。RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。
    # これらのバージョンではテスト（.ts の直接実行）も npm 12 も動かないため、ビルドは固定のバージョンの Node.js で行い、
    # Node.js を切り替えてから、プレーンな JavaScript の確認（test/compat）だけを実行する
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check dist on Node.js ${{ matrix.node }}
        run: |
          node --version
          node --test test/compat/esm.test.mjs test/compat/cjs.test.cjs

  browsers:
    # 公開する dist を、ランナーに入っている Chrome・Firefox・Edge で確かめる（RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。
    # ブラウザーのバージョンはランナーのイメージの更新で変わる（その時点の最新の安定バージョンで確かめる）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      # ドライバーの場所は、ランナーのイメージが環境変数で示す
      - run: node scripts/test-browsers.ts chrome "${CHROMEWEBDRIVER}/chromedriver"
      - run: node scripts/test-browsers.ts firefox "${GECKOWEBDRIVER}/geckodriver"
      - run: node scripts/test-browsers.ts edge "${EDGEWEBDRIVER}/msedgedriver"

  safari:
    # Safari は macOS のランナーでだけ動く。macos-latest は移り変わるのでバージョンを固定する
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - run: sudo safaridriver --enable
      - run: node scripts/test-browsers.ts safari /usr/bin/safaridriver

  workerd:
    # 公開する dist を、Cloudflare Workers の実行環境（workerd。本番と同じコード）で確かめる（RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。
    # workerd は npm の依存にせず、バージョンと SHA-256 を固定した公式のリリースを取得する（熟成ゲートを過ぎたバージョンを指定すること）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Install workerd
        env:
          WORKERD_VERSION: "1.20261014.1"
          WORKERD_SHA256: "f4fcdafea302598cc1dfd7ab155b50340019cd52bce9472553ba84d31283ba5b"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/workerd.gz" \
            "https://github.com/cloudflare/workerd/releases/download/v${WORKERD_VERSION}/workerd-linux-64.gz"
          echo "${WORKERD_SHA256}  ${RUNNER_TEMP}/workerd.gz" | sha256sum -c -
          gunzip "${RUNNER_TEMP}/workerd.gz"
          chmod +x "${RUNNER_TEMP}/workerd"
          "${RUNNER_TEMP}/workerd" --version
      - run: node scripts/test-workerd.ts "${RUNNER_TEMP}/workerd"

  bun:
    # 公開する dist を Bun で確かめる（RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。workerd と同じく npm の依存にせず、
    # バージョンと SHA-256 を固定した公式のリリースを取得する（熟成ゲートを過ぎたバージョンを指定すること）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Install Bun
        env:
          BUN_VERSION: "1.4.3"
          BUN_SHA256: "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  ${RUNNER_TEMP}/bun.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun"
          "${RUNNER_TEMP}/bun/bun-linux-x64/bun" --version
      - name: Check dist on Bun
        run: '"${RUNNER_TEMP}/bun/bun-linux-x64/bun" run test/compat/runtime.mjs'

  deno:
    # 公開する dist を Deno で確かめる（RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。--unstable-temporal は、Temporal が既定で有効でないバージョンでも本物の Temporal で確かめるために付ける（既定で有効なバージョンでは何も変えない）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Install Deno
        env:
          DENO_VERSION: "2.9.7"
          DENO_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/deno.zip" \
            "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  ${RUNNER_TEMP}/deno.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/deno.zip" -d "${RUNNER_TEMP}/deno"
          "${RUNNER_TEMP}/deno/deno" --version
      - name: Check dist on Deno
        run: '"${RUNNER_TEMP}/deno/deno" run --unstable-temporal test/compat/runtime.mjs'

  consumer-types:
    # 公開する型定義を、利用者が使う TypeScript の複数のバージョンで型チェックする（RELEASING.md の「品質の仕組みの理由」の「確かめる実行環境」）。
    # 各バージョンは npm の依存にせず、バージョンと SHA-256 を固定した tgz から一時的に入れる。バージョンの選び方は RELEASING.md。
    # プレリリース（prerelease: true）の行は、次のバージョンへの対応の準備として動かし、失敗してもワークフローを落とさない
    # （continue-on-error）。失敗は Job Summary に出す
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ matrix.prerelease == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "5.0.4"
            sha256: "1e83cd17f6d48dc60d539b64684d225c019db032685f28903aa45c42dac9fa5e"
          - version: "5.5.4"
            sha256: "2680b6354d462a1d90a2cf10c790e071f1c45081c9d4561cb47ce23c934d8586"
          - version: "5.8.3"
            sha256: "72e75dbeb92c2e6eb9a34cb59d74fab5c2ee6f32a0324a89405f6165d5a08374"
          - version: "7.0.2"
            sha256: "da2513f4b95176d6dde8b51aab7afe8a927656c9d277369793f77f7e59371c08"
            binary: "@typescript/typescript-linux-x64"
            binary_sha256: "7ecad6f67377e831856367ab062ef394f21506a611405bf8ac0ff039348637d3"
          - version: "7.1.0-beta"
            sha256: "f7d45457143046af7ba31db100fd5e113aaddcae75f44c1bbb0741e57cab35c9"
            binary: "@typescript/typescript-linux-x64"
            binary_sha256: "59128685cb55f44c9e6644ef5edb3cb321618d9547b4ee94c3038598ffd51855"
            prerelease: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Install TypeScript ${{ matrix.version }} into a temporary directory
        env:
          TS_VERSION: ${{ matrix.version }}
          TS_SHA256: ${{ matrix.sha256 }}
          TS_BINARY: ${{ matrix.binary }}
          TS_BINARY_SHA256: ${{ matrix.binary_sha256 }}
        run: |
          dir="${RUNNER_TEMP}/typescript"
          mkdir -p "${dir}"
          cd "${dir}"
          npm pack "typescript@${TS_VERSION}" --ignore-scripts --silent
          echo "${TS_SHA256}  typescript-${TS_VERSION}.tgz" | sha256sum -c -
          packages=("./typescript-${TS_VERSION}.tgz")
          if [ -n "${TS_BINARY}" ]; then
            npm pack "${TS_BINARY}@${TS_VERSION}" --ignore-scripts --silent
            file="$(echo "${TS_BINARY}" | sed 's|^@||; s|/|-|')-${TS_VERSION}.tgz"
            echo "${TS_BINARY_SHA256}  ${file}" | sha256sum -c -
            packages+=("./${file}")
          fi
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --save=false "${packages[@]}"
          node node_modules/typescript/bin/tsc --version
      - name: Type-check the consumer project with TypeScript ${{ matrix.version }}
        run: node scripts/check-consumer-types.ts --tsc "${RUNNER_TEMP}/typescript/node_modules/typescript/bin/tsc"
      - name: The repository's dependencies are unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Report a failure with a prerelease TypeScript
        if: ${{ !success() && matrix.prerelease == true }}
        env:
          TS_VERSION: ${{ matrix.version }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### プレリリースの TypeScript ${TS_VERSION} で失敗した（ジョブの状態: ${JOB_STATUS}）"
            echo ""
            echo "ワークフローは落とさない（continue-on-error）。型定義の問題なら直し、TypeScript の不具合なら報告する（RELEASING.md の品質の確認の「利用者の型チェック」）"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::warning::consumer types failed with the prerelease TypeScript ${TS_VERSION} (job status: ${JOB_STATUS})"

  bench:
    # 性能の退行を、公開済みの前のバージョン（npm の latest）と同じランナーで比べて検出する（RELEASING.md の「品質の仕組みの理由」の「前のバージョンと比べる」）。
    # どれかの計測が 2 倍より遅ければ失敗。絶対値は Job Summary に残す
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Fetch the published version for comparison
        run: |
          base="$(npm view bizdays-toolkit version)"
          echo "BASE_VERSION=${base}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/base"
          cd "${RUNNER_TEMP}/base"
          npm pack "bizdays-toolkit@${base}" --ignore-scripts --silent
          tar -xzf "bizdays-toolkit-${base}.tgz"
          echo "comparing with bizdays-toolkit@${base}"
      - name: Measure both versions
        run: |
          node scripts/bench.ts --package "${RUNNER_TEMP}/base/package" --json "${RUNNER_TEMP}/base.json"
          node scripts/bench.ts --package . --json "${RUNNER_TEMP}/head.json"
      - name: Compare (fail if more than 2x slower)
        run: |
          node scripts/bench-compare.ts "${RUNNER_TEMP}/base.json" "${RUNNER_TEMP}/head.json" \
            --ratio 2 --base-label "${BASE_VERSION}" --head-label "HEAD" | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  data-compare:
    # 同梱の提供元の祝日データを、公開済みの前のバージョン（npm の latest）と 1 日ずつ比べる（RELEASING.md の「品質の仕組みの理由」の「前のバージョンと比べる」）。
    # 失敗の条件は scripts/data-compare.ts。差分は Job Summary に残す
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Fetch the published version for comparison
        run: |
          base="$(npm view bizdays-toolkit version)"
          echo "BASE_VERSION=${base}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/base"
          cd "${RUNNER_TEMP}/base"
          npm pack "bizdays-toolkit@${base}" --ignore-scripts --silent
          tar -xzf "bizdays-toolkit-${base}.tgz"
          echo "comparing with bizdays-toolkit@${base}"
      - name: Compare the holiday data
        run: |
          node scripts/data-compare.ts --base "${RUNNER_TEMP}/base/package" --head . \
            --base-label "${BASE_VERSION}" | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  oracle:
    # 診断の総当たりのオラクル（test/diagnose-oracle.test.ts）を、すべての組み合わせで動かす。1 ジョブの時間を
    # RELEASING.md の決まり（10 分以内）に収めるため、ORACLE_SHARD で行列に分ける。pnpm check は決まった抜き出しだけを試す。
    # 完全性の報告（取り除けるのに何も出ない項目）と、設定の内訳とテストごとの時間を Job Summary に残す。
    # 最後に、ジョブの時間を同じ分の直近 3 回の main の実行と比べる（scripts/job-time.ts。actions: read はそのため）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm test:oracle
        env:
          ORACLE_FULL: "1"
          ORACLE_SHARD: ${{ matrix.shard }}
      - name: Compare the job time with recent main runs
        run: node scripts/job-time.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tool-selftest:
    # 検査のスクリプトが、入れた誤りで実際に失敗することを確かめる（scripts/tool-selftest.ts）。リポジトリの写しを作業ツリーで作り、
    # check-size が前のバージョンのタグを読むので、履歴とタグを取得する
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - name: Test the test tools (test/tools)
        run: pnpm test:tools
      - name: Check that the check scripts fail on injected errors
        run: |
          node scripts/tool-selftest.ts | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  catch-coverage:
    # src/core の catch 節がテストで 1 回以上通ることを、Node.js の組み込みのカバレッジで確かめる（scripts/check-catch-coverage.ts）。
    # 全体のカバレッジの率は目標にしないので出さない
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - name: Check that every catch clause in src/core is reached
        run: |
          node scripts/check-catch-coverage.ts | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  diagnose-consistency:
    # pnpm check では抜き出しだけを試す 4 つの全件を、ここで動かす: 診断と判定の一致（目録の設定の全件 150 件。pnpm check は 12 件）、
    # API どうしの整合（test/consistency.test.ts）、診断の性質のテスト（test/diagnose-properties.test.ts）、変形しても結果が同じ（test/metamorphic.test.ts）。
    # 最後に、ジョブの時間を直近 3 回の main の実行と比べる（scripts/job-time.ts。actions: read はそのため）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: node --import ./scripts/strict-warnings.ts --test --test-name-pattern="診断と判定の一致" test/faulty-provider.test.ts
        env:
          CONSISTENCY_FULL: "1"
      # 整合 7・8・11 は決まった設定だけを試し、件数が環境変数で変わらない（pnpm check で動かしている）ので、ここでは動かさない
      - run: node --import ./scripts/strict-warnings.ts --test --test-skip-pattern="^整合 (7|8|11):" test/consistency.test.ts
        env:
          CONSISTENCY_API_FULL: "1"
      - run: node --import ./scripts/strict-warnings.ts --test test/diagnose-properties.test.ts
        env:
          DIAGNOSE_PROPERTY_FULL: "1"
      - run: node --import ./scripts/strict-warnings.ts --test test/metamorphic.test.ts
        env:
          METAMORPHIC_FULL: "1"
      - name: Compare the job time with recent main runs
        run: node scripts/job-time.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  generator-features:
    # 実際の呼び出し側（乱数のテストと result-compare）を動かし、作った設定の特徴が生成範囲の記録
    # （test/fixtures/generator-features-0.30.3/）をすべて含むことを確かめる（scripts/record-generator-features.ts）。
    # 読み込みのフックで部品を差し替えるので、Node.js のバージョンは 1 つに固定する。前のバージョンの番号をタグから求めるので履歴とタグを取得する
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - name: Check the generators of the callers against the record
        run: |
          node scripts/record-generator-features.ts --worktree --check | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  result-compare:
    # 同じ設定の結果（カレンダー・スケジュール・診断）を、公開済みの前のバージョン（npm の latest）と 1 日ずつ比べる（RELEASING.md の「品質の仕組みの理由」の「前のバージョンと比べる」）。
    # 改名の前の 0.22.2 とも、旧名の設定で比べる（改名は結果を変えないという約束を確かめるため。RELEASING.md の「1.0.0 で行う作業」で外す）。
    # 失敗の条件と意図した差分の扱いは scripts/result-compare.ts。差分は Job Summary に残す
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEGACY_BASE_VERSION: "0.22.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "26.13.0"
      - run: pnpm build
      - name: Fetch the published versions for comparison
        run: |
          base="$(npm view bizdays-toolkit version)"
          echo "BASE_VERSION=${base}" >> "${GITHUB_ENV}"
          for version in "${base}" "${LEGACY_BASE_VERSION}"; do
            mkdir -p "${RUNNER_TEMP}/${version}"
            (cd "${RUNNER_TEMP}/${version}" && npm pack "bizdays-toolkit@${version}" --ignore-scripts --silent \
              && tar -xzf "bizdays-toolkit-${version}.tgz")
          done
          echo "comparing with bizdays-toolkit@${base} and @${LEGACY_BASE_VERSION}"
      - name: Compare the results with the latest version
        run: |
          node scripts/result-compare.ts --base "${RUNNER_TEMP}/${BASE_VERSION}/package" --head . \
            --base-label "${BASE_VERSION}" | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Compare the results with the version before the renaming
        run: |
          node scripts/result-compare.ts --base "${RUNNER_TEMP}/${LEGACY_BASE_VERSION}/package" --head . \
            --base-label "${LEGACY_BASE_VERSION}" | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0
      # 文章の主張の検査（scripts/check-claims.ts）の、前のバージョンが要る部分（d）: 変わった dist の .js・.d.ts の一覧と CHANGELOG の
      # 区分。.js・.d.ts が変わったのに利用者向けの区分がなければ失敗する（決定の番号の参照の表 c は、リリースの前に手元で読む）
      - name: List the published changes
        run: |
          node scripts/check-claims.ts --base "${RUNNER_TEMP}/${BASE_VERSION}/package" \
            | tee -a "${GITHUB_STEP_SUMMARY}"
          test "${PIPESTATUS[0]}" -eq 0

  workflows:
    # ワークフローの構文・式・シェルスクリプトの誤りを actionlint で検出する（pnpm check はワークフローを検査しない）。
    # actionlint は npm の依存にせず、バージョンと SHA-256 を固定した公式のリリースを取得する（熟成ゲートを過ぎたバージョンを指定すること）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          # ランナーに shellcheck がないと、actionlint は run: のスクリプトの検査を黙って飛ばすため確かめる
          if ! command -v shellcheck > /dev/null; then
            echo "::error::shellcheck is not installed on the runner" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/actionlint" -version
          shellcheck --version | sed -n 2p
          "${RUNNER_TEMP}/actionlint" -color
