name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu-latest は 2026-10-19 から Ubuntu 26 に切り替わるため、版を固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # npm 12 の動作要件（^22.22.2 || ^24.15.0）を満たす版
        node: ["22.23.3", "24.22.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # サイズの上限の検査（scripts/check-size.ts）が前の版のタグを読むため、履歴とタグを取得する
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check
      - name: Show package contents
        run: npm pack --dry-run --ignore-scripts

  workflows:
    # ワークフローの構文・式・シェルスクリプトの誤りを actionlint で検出する（pnpm check はワークフローを検査しない）。
    # actionlint は npm の依存にせず、版と SHA-256 を固定した公式のリリースを取得する（熟成ゲートを過ぎた版を指定すること）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          # ランナーに shellcheck がないと、actionlint は run: のスクリプトの検査を黙って飛ばすため確かめる
          if ! command -v shellcheck > /dev/null; then
            echo "::error::shellcheck is not installed on the runner" >&2
            exit 1
          fi
          "${RUNNER_TEMP}/actionlint" -version
          shellcheck --version | sed -n 2p
          "${RUNNER_TEMP}/actionlint" -color
