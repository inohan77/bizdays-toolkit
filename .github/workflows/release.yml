name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release の作成
      id-token: write # npm Trusted Publishing（provenance）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # サイズの上限の検査（scripts/check-size.ts）が前の版のタグを読むため、履歴とタグを取得する
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org

      - name: Verify the release
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          if grep -n "OWNER" package.json CHANGELOG.md; then
            echo "::error::Replace OWNER with the GitHub account name before releasing" >&2
            exit 1
          fi
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
            echo "::error::${name}@${version} is already published on npm" >&2
            exit 1
          fi
          heading="$(grep -m1 -E "^## \[${version}\]" CHANGELOG.md || true)"
          changelog_date="$(printf '%s' "${heading}" | sed -nE 's/^## \[[^]]+\] - ([0-9]{4}-[0-9]{2}-[0-9]{2})$/\1/p')"
          commit_date="$(TZ=Asia/Tokyo git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          today="$(TZ=Asia/Tokyo date +%F)"
          if [ -z "${changelog_date}" ]; then
            # 見出しがない、または日付が YYYY-MM-DD のまま（タグの前に当日の日付にする）
            echo "::error::CHANGELOG heading for ${version} has no date: ${heading:-(no heading)}; expected ## [${version}] - ${today} (Asia/Tokyo)" >&2
            exit 1
          fi
          # 未来の日付と、タグを付けたコミットより前の日付（前の版の日付の書き換え忘れ）を止める。
          # 範囲で確かめるので、失敗したワークフローを翌日以降に再実行しても止まらない
          if [[ "${changelog_date}" > "${today}" ]] || [[ "${changelog_date}" < "${commit_date}" ]]; then
            echo "::error::CHANGELOG date for ${version} is ${changelog_date}; expected ${commit_date}..${today} (Asia/Tokyo)" >&2
            exit 1
          fi

      - run: pnpm check

      - name: Stage on npm
        # staged publishing: ステージした版は、メンテナーが npmjs.com（または npm stage approve）で
        # 2FA 付きで承認するまで利用者に届かない。Trusted Publisher の設定では npm publish を許可しない
        run: |
          set -o pipefail # tee につないでも npm の失敗でステップを止める
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm stage publish --provenance --access public --tag "${dist_tag}" --ignore-scripts \
            2>&1 | tee "${RUNNER_TEMP}/stage.log"
          name="$(node -p "require('./package.json').name")"
          {
            echo "## ${name}@${GITHUB_REF_NAME#v} をステージしました（dist-tag: ${dist_tag}）"
            echo
            echo "まだ利用者には届いていません。次の手順で承認してください。"
            echo
            echo "1. https://www.npmjs.com/package/${name} の Staged Packages タブで中身を確認し、Approve する（2FA）"
            echo "2. GitHub Release の下書きを公開する: \`gh release edit ${GITHUB_REF_NAME} --draft=false\`"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/stage.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub Release (draft)
        # npm で承認するまでは下書きにしておき、承認後に公開する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag --draft ${prerelease}
