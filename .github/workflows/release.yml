name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release の作成
      id-token: write # npm Trusted Publishing（provenance）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g pnpm@12.10.1
      - run: pnpm install --frozen-lockfile

      - name: Verify that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Verify that no placeholders remain
        run: |
          if grep -n "OWNER" package.json CHANGELOG.md; then
            echo "Replace OWNER with the GitHub account name before releasing" >&2
            exit 1
          fi

      - run: pnpm check

      - name: Publish to npm
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          npm publish --provenance --access public --tag "${dist_tag}" --ignore-scripts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > release-notes.md
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md --verify-tag ${prerelease}
