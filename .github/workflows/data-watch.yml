name: Watch holiday data (GOV.UK, data.gov.sg, the Cabinet Office and data.gouv.fr)

# 公式の祝日データを毎日取得し、ライブラリ・フィクスチャと食い違えば issue を立てる。
# - 英国: GOV.UK の bank holidays。照合は scripts/verify-govuk.ts（pnpm verify:govuk と同じ）。ラベル govuk-data。
#   臨時の祝日（国葬など）は 10 日ほど前に発表されることがあるため、毎日確かめる
# - シンガポール: data.gov.sg のコレクション 691（MOM）。照合は scripts/verify-datagovsg.ts（pnpm verify:datagovsg と同じ）。ラベル datagovsg-data。
#   翌年の祝日は 4〜7 月ごろに公開され、Hari Raya の日付があとから改定されることがある
# - 日本: 内閣府「国民の祝日」CSV。照合は scripts/verify-cao.ts（pnpm verify:cao と同じ）。ラベル cao-data。
#   翌年の春分・秋分の日は 2 月ごろに公表される（New years published が毎年の作業の引き金）。法改正による祝日の新設・移動と、
#   CSV の形式の変更（解析の失敗）も、2 月の作業を待たずに見つける
# - フランス: data.gouv.fr「Jours fériés en France」の JSON（metropole・alsace-moselle）。照合は scripts/verify-datagouv.ts（pnpm verify:datagouv と同じ）。
#   ラベル datagouv-data。祝日は法令で定まるので差分は法改正のとき。JSON の窓（過去 20 年・未来 5 年）は毎年 1 月に動くので、
#   そのときはフィクスチャの差分だけが出る（--write で更新。版は要らない）
# 差分を見つけたら、フィクスチャとその国の src/<国>/rules.ts を 1 つのコミットで直してパッチ版を出す（RELEASING.md）。
# 照合は 1 回の起動で順に行い、すべてが動いたときだけハートビートを知らせる。
#
# 起動のしかた（decisions.md の 28 番）:
# - 主: 外部の cron サービス（cron-job.org）が、毎日 06:00（日本時間）に workflow_dispatch を API で呼ぶ
# - 予備: GitHub の schedule（時刻をずらして 18:17）。どちらかが動けば確認が入る
# - 動いたことは、最後にハートビート（healthchecks.io）へ知らせる。知らせが一定時間来なければ、
#   healthchecks.io からメールが届く（監視が動かなかったことに気付くため）

on:
  schedule:
    - cron: "17 9 * * *" # 毎日 18:17（日本時間）。主の起動は cron-job.org（06:00）
  workflow_dispatch:
    inputs:
      simulate:
        description: "Add a fictitious holiday to test the issue path (opens govuk-data-simulation, datagovsg-data-simulation, cao-data-simulation and datagouv-data-simulation issues)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # 差分の issue の作成・更新
      actions: write # このワークフローの有効化（60 日間動きのないリポジトリで定期実行が止まるのを防ぐ）
    env:
      GH_TOKEN: ${{ github.token }}
      # 模擬（手動実行の simulate）では、本物の差分の issue と混ざらないよう、別のラベルと題名にする
      LABEL: ${{ inputs.simulate && 'govuk-data-simulation' || 'govuk-data' }}
      TITLE: ${{ inputs.simulate && '[Simulation] ' || '' }}GOV.UK bank holidays differ from the bundled data
      SG_LABEL: ${{ inputs.simulate && 'datagovsg-data-simulation' || 'datagovsg-data' }}
      SG_TITLE: ${{ inputs.simulate && '[Simulation] ' || '' }}data.gov.sg public holidays differ from the bundled data
      JP_LABEL: ${{ inputs.simulate && 'cao-data-simulation' || 'cao-data' }}
      JP_TITLE: ${{ inputs.simulate && '[Simulation] ' || '' }}Cabinet Office holidays (Japan) differ from the bundled data
      FR_LABEL: ${{ inputs.simulate && 'datagouv-data-simulation' || 'datagouv-data' }}
      FR_TITLE: ${{ inputs.simulate && '[Simulation] ' || '' }}data.gouv.fr public holidays (France) differ from the bundled data
      SIMULATE: ${{ inputs.simulate && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: "24.22.0"

      # runner コンテキストはジョブの env では使えないため、結果のファイルのパスはここで決める
      - name: Set the report paths
        run: |
          {
            echo "REPORT=${RUNNER_TEMP}/govuk-report.md"
            echo "SG_REPORT=${RUNNER_TEMP}/datagovsg-report.md"
            echo "JP_REPORT=${RUNNER_TEMP}/cao-report.md"
            echo "FR_REPORT=${RUNNER_TEMP}/datagouv-report.md"
          } >> "${GITHUB_ENV}"

      - name: Compare with GOV.UK
        id: verify
        continue-on-error: true
        run: |
          args=(--report "${REPORT}")
          if [ "${SIMULATE}" = "true" ]; then args+=(--simulate); fi
          # 終了コード（0 = 一致、1 = 差分あり、2 = 取得・解析の失敗）を、ハートビートの知らせ方に使う
          set +e
          node scripts/verify-govuk.ts "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Add the latest changes to the GOV.UK data
        if: steps.verify.outcome == 'failure'
        run: |
          {
            echo "### Latest commits to the GOV.UK data (alphagov/frontend)"
            echo
            gh api "repos/alphagov/frontend/commits?path=lib/data/bank-holidays.json&per_page=3" \
              --jq '.[] | "- \(.commit.committer.date[:10]) [\(.sha[:8])](\(.html_url)) \(.commit.message | split("\n")[0])"' \
              || echo "- (could not read the commits)"
          } >> "${REPORT}"

      - name: Open or update the issue
        if: steps.verify.outcome == 'failure'
        run: |
          gh label create "${LABEL}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "GOV.UK bank holidays differ from the bundled data" --force
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${LABEL}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --label "${LABEL}" \
              --title "${TITLE}" --body-file "${REPORT}"
            exit 0
          fi
          # 1 行目（確認した日付）を除いて内容が変わったときだけ、本文を更新してコメントで知らせる
          current="$(gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body | tail -n +2)"
          if [ "${current}" != "$(tail -n +2 "${REPORT}")" ]; then
            gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${REPORT}"
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "The differences changed on $(TZ=Asia/Tokyo date +%F). See the updated description."
          fi

      - name: Compare with data.gov.sg
        id: verify_sg
        continue-on-error: true
        run: |
          args=(--report "${SG_REPORT}")
          if [ "${SIMULATE}" = "true" ]; then args+=(--simulate); fi
          set +e
          node scripts/verify-datagovsg.ts "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Open or update the data.gov.sg issue
        if: steps.verify_sg.outcome == 'failure'
        run: |
          gh label create "${SG_LABEL}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "data.gov.sg public holidays differ from the bundled data" --force
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${SG_LABEL}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --label "${SG_LABEL}" \
              --title "${SG_TITLE}" --body-file "${SG_REPORT}"
            exit 0
          fi
          current="$(gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body | tail -n +2)"
          if [ "${current}" != "$(tail -n +2 "${SG_REPORT}")" ]; then
            gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${SG_REPORT}"
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "The differences changed on $(TZ=Asia/Tokyo date +%F). See the updated description."
          fi

      - name: Compare with the Cabinet Office CSV
        id: verify_jp
        continue-on-error: true
        run: |
          args=(--report "${JP_REPORT}")
          if [ "${SIMULATE}" = "true" ]; then args+=(--simulate); fi
          set +e
          node scripts/verify-cao.ts "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Open or update the Cabinet Office issue
        if: steps.verify_jp.outcome == 'failure'
        run: |
          gh label create "${JP_LABEL}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "Cabinet Office holidays (Japan) differ from the bundled data" --force
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${JP_LABEL}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --label "${JP_LABEL}" \
              --title "${JP_TITLE}" --body-file "${JP_REPORT}"
            exit 0
          fi
          current="$(gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body | tail -n +2)"
          if [ "${current}" != "$(tail -n +2 "${JP_REPORT}")" ]; then
            gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${JP_REPORT}"
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "The differences changed on $(TZ=Asia/Tokyo date +%F). See the updated description."
          fi

      - name: Compare with data.gouv.fr
        id: verify_fr
        continue-on-error: true
        run: |
          args=(--report "${FR_REPORT}")
          if [ "${SIMULATE}" = "true" ]; then args+=(--simulate); fi
          set +e
          node scripts/verify-datagouv.ts "${args[@]}"
          code=$?
          set -e
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Open or update the data.gouv.fr issue
        if: steps.verify_fr.outcome == 'failure'
        run: |
          gh label create "${FR_LABEL}" --repo "${GITHUB_REPOSITORY}" --color D93F0B \
            --description "data.gouv.fr public holidays (France) differ from the bundled data" --force
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --label "${FR_LABEL}" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "${number}" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" --label "${FR_LABEL}" \
              --title "${FR_TITLE}" --body-file "${FR_REPORT}"
            exit 0
          fi
          current="$(gh issue view "${number}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body | tail -n +2)"
          if [ "${current}" != "$(tail -n +2 "${FR_REPORT}")" ]; then
            gh issue edit "${number}" --repo "${GITHUB_REPOSITORY}" --body-file "${FR_REPORT}"
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "The differences changed on $(TZ=Asia/Tokyo date +%F). See the updated description."
          fi

      - name: Keep the schedule enabled
        if: always()
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/data-watch.yml/enable"

      # すべての照合まで動いたら（一致・差分あり）成功を、どれかの照合そのものが失敗したら /fail を知らせる。
      # 知らせ先の URL は Secrets（HEALTHCHECKS_PING_URL）に置く。未設定なら知らせずに通知だけ出す
      - name: Send the heartbeat
        if: always()
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          CODE: ${{ steps.verify.outputs.code }}
          SG_CODE: ${{ steps.verify_sg.outputs.code }}
          JP_CODE: ${{ steps.verify_jp.outputs.code }}
          FR_CODE: ${{ steps.verify_fr.outputs.code }}
        run: |
          if [ -z "${PING_URL}" ]; then
            echo "::notice::HEALTHCHECKS_PING_URL is not set; no heartbeat sent"
            exit 0
          fi
          url="${PING_URL}"
          for code in "${CODE}" "${SG_CODE}" "${JP_CODE}" "${FR_CODE}"; do
            if [ "${code}" != "0" ] && [ "${code}" != "1" ]; then url="${PING_URL}/fail"; fi
          done
          curl -fsS -m 10 --retry 3 -o /dev/null "${url}" \
            || echo "::warning::could not send the heartbeat (healthchecks.io will alert if pings stop)"

      - name: Fail when GOV.UK, data.gov.sg, the Cabinet Office CSV or data.gouv.fr differs
        if: steps.verify.outcome == 'failure' || steps.verify_sg.outcome == 'failure' || steps.verify_jp.outcome == 'failure' || steps.verify_fr.outcome == 'failure'
        run: |
          if [ "${GOVUK_FAILED}" = "true" ]; then
            echo "::error::GOV.UK bank holidays differ from the bundled data (see the ${LABEL} issue)" >&2
          fi
          if [ "${SG_FAILED}" = "true" ]; then
            echo "::error::data.gov.sg public holidays differ from the bundled data (see the ${SG_LABEL} issue)" >&2
          fi
          if [ "${JP_FAILED}" = "true" ]; then
            echo "::error::Cabinet Office holidays (Japan) differ from the bundled data (see the ${JP_LABEL} issue)" >&2
          fi
          if [ "${FR_FAILED}" = "true" ]; then
            echo "::error::data.gouv.fr public holidays (France) differ from the bundled data (see the ${FR_LABEL} issue)" >&2
          fi
          exit 1
        env:
          GOVUK_FAILED: ${{ steps.verify.outcome == 'failure' }}
          SG_FAILED: ${{ steps.verify_sg.outcome == 'failure' }}
          JP_FAILED: ${{ steps.verify_jp.outcome == 'failure' }}
          FR_FAILED: ${{ steps.verify_fr.outcome == 'failure' }}
